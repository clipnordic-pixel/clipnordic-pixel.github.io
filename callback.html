<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Login complete – Clip Nordic</title>
<link rel="stylesheet" href="style.css">
<style>
  #kod { width: 100%; box-sizing: border-box; font: 15px/1.4 ui-monospace, Consolas, monospace; padding: 12px; border: 2px solid var(--link); border-radius: 8px; background: transparent; color: var(--fg); }
  button { margin-top: 12px; font: inherit; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--link); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>clip-agent</h1>
  <div id="ok" hidden>
    <p>Login with TikTok worked. Copy the code below and paste it into clip-agent on your computer.</p>
    <textarea id="kod" rows="3" readonly></textarea>
    <button id="kopiera" type="button">Copy code</button>
    <p id="kopierad" hidden>Copied.</p>
  </div>
  <div id="fel" hidden>
    <p>TikTok did not return a code.</p>
    <p id="feltext"></p>
  </div>
  <p><a href="index.html">Clip Nordic</a> · <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>
</main>
<script>
  // Visar koden från TikTok (?code=...&state=...). Koden skickas ingenstans, den visas bara här.
  const p = new URLSearchParams(location.search);
  const code = p.get("code");
  if (code) {
    document.getElementById("ok").hidden = false;
    const falt = document.getElementById("kod");
    falt.value = JSON.stringify({ code: code, state: p.get("state") || "" });
    document.getElementById("kopiera").onclick = async () => {
      falt.select();
      try { await navigator.clipboard.writeText(falt.value); } catch (e) { document.execCommand("copy"); }
      document.getElementById("kopierad").hidden = false;
    };
  } else {
    document.getElementById("fel").hidden = false;
    document.getElementById("feltext").textContent = (p.get("error") || "") + " " + (p.get("error_description") || "");
  }
</script>
</body>
</html>
